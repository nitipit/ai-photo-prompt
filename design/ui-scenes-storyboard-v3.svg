<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#182653"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79d7d2"/>
      <stop offset="1" stop-color="#d8f0e7"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c66c"/>
      <stop offset="1" stop-color="#ee6c62"/>
    </linearGradient>
    <linearGradient id="generated" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb55d"/>
      <stop offset="1" stop-color="#bd6171"/>
    </linearGradient>
    <style>
      .title { font-family: 'Noto Sans Thai Looped','Noto Sans Thai','DejaVu Sans',sans-serif; fill: #fff8e9; }
      .ink { font-family: 'Noto Sans Thai Looped','Noto Sans Thai','DejaVu Sans',sans-serif; fill: #fff8e9; }
      .muted { font-family: 'Noto Sans Thai Looped','Noto Sans Thai','DejaVu Sans',sans-serif; fill: #a9b5d4; }
      .dark { font-family: 'Noto Sans Thai Looped','Noto Sans Thai','DejaVu Sans',sans-serif; fill: #111936; }
      .scene { font-size: 16px; font-weight: 800; letter-spacing: .7px; }
      .small { font-size: 14px; }
      .body { font-size: 18px; }
      .buttonText { font-family: 'Noto Sans Thai Looped','Noto Sans Thai','DejaVu Sans',sans-serif; fill: #111936; font-size: 16px; font-weight: 900; }
      .frame { fill: url(#stage); stroke: #425383; stroke-width: 2; }
      .band { fill: #111936; }
      .accent { fill: #79d7d2; }
      .coral { fill: #ee6c62; }
      .gold { fill: #f5c66c; }
    </style>
  </defs>

  <rect width="1400" height="1800" fill="#070d25"/>
  <circle cx="1310" cy="72" r="190" fill="#79d7d2" opacity=".09"/>
  <circle cx="70" cy="1710" r="260" fill="#f5c66c" opacity=".08"/>

  <text x="50" y="58" class="title" font-size="34" font-weight="900">PHOTO PROMPT</text>
  <text x="50" y="94" class="muted" font-size="18">Storyboard v3 · immersive 16:9 scenes · 50-inch 4K TV</text>
  <rect x="1110" y="40" width="240" height="42" rx="21" fill="#1b2a57" stroke="#425383"/>
  <text x="1230" y="66" text-anchor="middle" class="title" font-size="15">image-first / Thai-first</text>

  <!-- 1 Ready -->
  <g transform="translate(40 135)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">01 · READY</text>
    <circle cx="320" cy="145" r="68" fill="#f5c66c" opacity=".96"/>
    <rect x="276" y="112" width="88" height="68" rx="18" fill="#fff8e9"/>
    <circle cx="320" cy="146" r="22" fill="#111936"/>
    <path d="M294 112 L307 92 L333 92 L346 112" fill="none" stroke="#fff8e9" stroke-width="11" stroke-linecap="round"/>
    <path d="M210 207 Q320 238 430 207" fill="none" stroke="#79d7d2" stroke-width="5" opacity=".7"/>
    <text x="320" y="224" text-anchor="middle" class="ink" font-size="25" font-weight="900">เขียน Prompt ให้ AI สร้างภาพ</text>
    <rect x="0" y="258" width="640" height="102" class="band"/>
    <text x="28" y="295" class="muted body">พร้อมท้าทาย AI หรือยัง?</text>
    <rect x="454" y="279" width="158" height="42" rx="21" class="gold"/>
    <text x="533" y="306" text-anchor="middle" class="buttonText">เริ่มเล่น</text>
  </g>

  <!-- 2 Level -->
  <g transform="translate(720 135)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">02 · LEVEL SELECTION</text>
    <circle cx="510" cy="110" r="66" fill="#79d7d2" opacity=".65"/>
    <path d="M425 198 L491 119 L540 168 L590 110 L640 198 Z" fill="#315779" opacity=".9"/>
    <circle cx="556" cy="74" r="18" fill="#f5c66c"/>
    <text x="28" y="84" class="ink" font-size="25" font-weight="900">ตั้งค่ารอบเล่น</text>
    <text x="28" y="119" class="muted body">ชื่อเล่น (ถ้าไม่กรอก: นิรนาม)</text>
    <rect x="28" y="133" width="360" height="42" rx="12" fill="#f7f4eb"/>
    <text x="48" y="160" class="dark body">พิมพ์ชื่อเล่น</text>
    <rect x="0" y="238" width="640" height="122" class="band"/>
    <text x="28" y="269" class="muted small">เลือกกลุ่มระดับ</text>
    <rect x="28" y="281" width="122" height="40" rx="20" fill="#79d7d2"/>
    <text x="89" y="306" text-anchor="middle" class="buttonText">ป.1–ป.3</text>
    <rect x="160" y="281" width="122" height="40" rx="20" fill="#d8e8b0"/>
    <text x="221" y="306" text-anchor="middle" class="buttonText">ป.4–ป.6</text>
    <rect x="292" y="281" width="122" height="40" rx="20" fill="#f5c66c"/>
    <text x="353" y="306" text-anchor="middle" class="buttonText">ม.1–ม.3</text>
    <rect x="424" y="281" width="122" height="40" rx="20" fill="#ee9a82"/>
    <text x="485" y="306" text-anchor="middle" class="buttonText">ม.4–ม.6</text>
    <text x="575" y="306" text-anchor="middle" class="ink" font-size="16" font-weight="900">ไปต่อ</text>
  </g>

  <!-- 3 Challenge -->
  <g transform="translate(40 535)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">03 · CHALLENGE REVEAL</text>
    <rect x="0" y="42" width="640" height="216" fill="url(#sky)"/>
    <circle cx="510" cy="94" r="37" fill="#f5c66c"/>
    <path d="M0 258 L132 120 L210 210 L306 132 L450 258 Z" fill="#527a75"/>
    <path d="M0 258 L98 178 L160 226 L236 174 L450 258 Z" fill="#284b58" opacity=".86"/>
    <rect x="0" y="258" width="640" height="102" class="band"/>
    <text x="28" y="294" class="ink" font-size="22" font-weight="900">สังเกตภาพนี้</text>
    <text x="28" y="324" class="muted body">แล้วคิดว่าจะบอก AI อย่างไร</text>
    <rect x="454" y="279" width="158" height="42" rx="21" class="coral"/>
    <text x="533" y="306" text-anchor="middle" class="title" font-size="16" font-weight="900">เริ่มเขียน</text>
  </g>

  <!-- 4 Prompt -->
  <g transform="translate(720 535)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">04 · WRITE PROMPT</text>
    <rect x="0" y="42" width="640" height="176" fill="url(#sky)"/>
    <circle cx="510" cy="92" r="35" fill="#f5c66c"/>
    <path d="M0 218 L132 107 L216 180 L309 122 L450 218 Z" fill="#527a75"/>
    <path d="M0 218 L99 159 L161 194 L241 150 L450 218 Z" fill="#284b58" opacity=".86"/>
    <rect x="0" y="218" width="640" height="142" class="band"/>
    <text x="28" y="248" class="muted small">ภาพอ้างอิงขนาดเล็ก · เขียน Prompt แบบอิสระ</text>
    <rect x="28" y="260" width="410" height="54" rx="12" fill="#f7f4eb"/>
    <text x="48" y="294" class="dark body">พิมพ์ Prompt ของคุณ...</text>
    <rect x="466" y="268" width="146" height="42" rx="21" class="gold"/>
    <text x="539" y="295" text-anchor="middle" class="buttonText">ส่ง Prompt</text>
    <text x="28" y="339" class="muted small">หมดเวลาแล้วจะส่งข้อความปัจจุบันอัตโนมัติ</text>
  </g>

  <!-- 5 Generating / reveal -->
  <g transform="translate(40 935)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">05 · GENERATING / REVEAL</text>
    <rect x="0" y="42" width="640" height="216" fill="url(#generated)"/>
    <circle cx="320" cy="142" r="70" fill="#f5c66c" opacity=".75"/>
    <path d="M0 258 L120 180 L196 226 L288 152 L420 258 Z" fill="#7f4f55" opacity=".9"/>
    <path d="M0 258 L104 214 L165 240 L245 197 L420 258 Z" fill="#4c425b" opacity=".84"/>
    <circle cx="320" cy="142" r="42" fill="none" stroke="#fff8e9" stroke-width="7" stroke-dasharray="65 25"/>
    <rect x="0" y="258" width="640" height="102" class="band"/>
    <text x="28" y="297" class="ink" font-size="22" font-weight="900">ภาพพร้อมแล้ว</text>
    <text x="28" y="326" class="muted body">แสดงภาพ 5 วินาที แล้วดูคะแนน</text>
    <rect x="486" y="282" width="126" height="34" rx="17" fill="#79d7d2"/>
    <text x="549" y="304" text-anchor="middle" class="buttonText">5 วินาที</text>
  </g>

  <!-- 6 Result -->
  <g transform="translate(720 935)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">06 · RESULT / FEEDBACK</text>
    <rect x="0" y="42" width="320" height="216" fill="url(#sky)"/>
    <circle cx="246" cy="91" r="34" fill="#f5c66c"/>
    <path d="M0 258 L112 141 L177 214 L250 151 L320 258 Z" fill="#527a75"/>
    <rect x="320" y="42" width="320" height="216" fill="url(#generated)"/>
    <circle cx="546" cy="91" r="32" fill="#ffe2a6"/>
    <path d="M320 258 L420 174 L478 215 L544 151 L640 258 Z" fill="#7f4f55" opacity=".9"/>
    <rect x="0" y="258" width="640" height="102" class="band"/>
    <text x="28" y="293" class="ink" font-size="22" font-weight="900">เก่งมาก!</text>
    <text x="156" y="293" class="gold" font-size="25" font-weight="900">82</text>
    <text x="206" y="291" class="muted small">คะแนน</text>
    <text x="28" y="324" class="muted small">บอกสีได้ชัดเจน · เพิ่มบรรยากาศได้อีก</text>
    <rect x="474" y="279" width="138" height="42" rx="21" class="coral"/>
    <text x="543" y="306" text-anchor="middle" class="title" font-size="15" font-weight="900">ดู Leaderboard</text>
  </g>

  <!-- 7 Leaderboard -->
  <g transform="translate(40 1335)">
    <rect width="640" height="360" class="frame"/>
    <text x="24" y="29" class="muted scene">07 · LEADERBOARD</text>
    <text x="24" y="68" class="ink" font-size="23" font-weight="900">กลุ่ม ป.4–ป.6</text>
    <g transform="translate(24 84)">
      <rect width="592" height="48" rx="10" fill="#f5c66c"/>
      <text x="15" y="31" class="dark scene">01</text><text x="61" y="31" class="dark body">น้องฟ้า</text><rect x="170" y="7" width="56" height="34" rx="7" fill="url(#generated)"/><text x="198" y="29" text-anchor="middle" class="title small">ภาพ</text><text x="245" y="30" class="dark small">“ภาพภูเขาสี...”</text><text x="556" y="31" class="dark scene">94</text>
      <rect y="58" width="592" height="48" rx="10" fill="#d8e8b0"/>
      <text x="15" y="89" class="dark scene">02</text><text x="61" y="89" class="dark body">น้องต้น</text><rect x="170" y="65" width="56" height="34" rx="7" fill="url(#generated)"/><text x="198" y="87" text-anchor="middle" class="title small">ภาพ</text><text x="245" y="88" class="dark small">“ท้องฟ้ากว้าง...”</text><text x="556" y="89" class="dark scene">88</text>
      <rect y="116" width="592" height="48" rx="10" fill="#79d7d2"/>
      <text x="15" y="147" class="dark scene">03</text><text x="61" y="147" class="dark body">คุณ</text><rect x="170" y="123" width="56" height="34" rx="7" fill="url(#generated)"/><text x="198" y="145" text-anchor="middle" class="title small">ภาพ</text><text x="245" y="146" class="dark small">“ภูเขา มีแสง...”</text><text x="556" y="147" class="dark scene">82</text>
    </g>
    <rect x="0" y="258" width="640" height="102" class="band"/>
    <text x="28" y="294" class="ink" font-size="21" font-weight="900">ดูไอเดียของเพื่อน ๆ</text>
    <text x="28" y="324" class="muted small">อันดับ · ชื่อ · คะแนน · ภาพ · Prompt เต็ม</text>
    <rect x="476" y="279" width="136" height="42" rx="21" class="gold"/>
    <text x="544" y="306" text-anchor="middle" class="buttonText">กลับหน้าเริ่ม</text>
  </g>

  <text x="720" y="1510" class="title" font-size="22" font-weight="900">Immersive UI direction</text>
  <text x="720" y="1548" class="muted" font-size="17">hero image · bottom action band</text>
  <text x="720" y="1582" class="muted" font-size="17">Thai-first · Noto Sans Thai Looped</text>
  <text x="720" y="1616" class="muted" font-size="17">navy · teal · coral · gold</text>
  <text x="700" y="1760" text-anchor="middle" class="muted" font-size="16">Concept draft v3 · visual alignment only · no application implementation</text>
</svg>
